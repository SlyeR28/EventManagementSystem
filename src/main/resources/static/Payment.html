<!DOCTYPE html>
<html>
<head>
    <title>Event Payment</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<h2>Pay for your event ticket</h2>
<button id="payBtn">Pay Now</button>

<script>
    document.getElementById("payBtn").onclick = async function() {
        try {
            const orderId = 8 // Replace with actual order ID
            const amount = 8997; // Amount in INR (backend expects double)
            const email = "aditya_singh@outlook.com";

            // 1️⃣ Create payment via backend
            const createRes = await fetch(`/api/payments/create/razorpay`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    orderId: orderId,
                    amount: amount,
                    currency: "INR",
                    description: "Event ticket",
                    email: email,
                    paymentProviders: "RAZORPAY"
                })
            });

            if (!createRes.ok) throw new Error("Failed to create payment");
            const data = await createRes.json();

            // 2️⃣ Open Razorpay Checkout
            const options = {
                key: "rzp_test_RajIeawiamBuBm", // Replace with your Razorpay Key
                amount: data.amount * 100, // in paise
                currency: "INR",
                name: "Event Management",
                description: data.description || "Event Ticket",
                order_id: data.providerOrderId, // Razorpay order ID
                handler: async function(response) {
                    // 3️⃣ Verify payment on backend
                    const verifyRes = await fetch(
                        `/api/payments/razorpay/verify?orderId=${data.orderId}&providerPaymentId=${response.razorpay_payment_id}&providerOrderId=${response.razorpay_order_id}&providerSignature=${response.razorpay_signature}`,
                        { method: "POST" }
                    );

                    if (!verifyRes.ok) throw new Error("Payment verification failed");

                    const verifyData = await verifyRes.json();
                    if (verifyData.verified) {
                        alert("✅ Payment successful!");
                    } else {
                        alert("❌ Payment verification failed.");
                    }
                },
                prefill: { email: email },
                theme: { color: "#3399cc" }
            };

            const rzp = new Razorpay(options);
            rzp.open();

        } catch (err) {
            console.error(err);
            alert("⚠ Error: " + err.message);
        }
    };
</script>
</body>
</html>
